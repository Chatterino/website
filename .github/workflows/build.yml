---
name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build site
        run: cargo run --release -- --prod

      - name: Upload output files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Output Files
          path: out/*

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=website

      - name: Comment deployment-url
        if: github.ref != 'refs/heads/main'
        uses: Chatterino/actions-comment-pull-request@e4a76dd2b0a3c2027c3fd84147a67c22ee4c90fa # main
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          comment-tag: preview
          message: |
            | Status  | ✅ Deploy Successful! |
            | :------------ | :------------ |
            | Preview Url:  |  ${{ steps.deploy.outputs.deployment-url }} |
            | Branch Preview Url:  | ${{ steps.deploy.outputs.pages-deployment-alias-url }}  |
